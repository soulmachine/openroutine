# Pushing a v* tag releases that version everywhere at once: crates.io, a
# GitHub release with prebuilt binaries, PyPI, npm, and the Homebrew formula
# this repo serves as a tap. The npm package downloads from the GitHub release
# at install time, so npm publishes only after the release exists; the wheels
# bundle the binary, so PyPI does not have to wait. All three registries
# authenticate by OIDC trusted publishing — configured on crates.io, PyPI, and
# npmjs.com for this repo and this workflow file — so no registry token exists
# anywhere, and the formula bump uses the built-in GITHUB_TOKEN.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The whole release fails fast if the tag, Cargo.toml, and npm/package.json
  # disagree about the version — nothing partial is ever published.
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: versions agree
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$VERSION\"\$" Cargo.toml
          node -e "process.exit(require('./npm/package.json').version === '$VERSION' ? 0 : 1)"
      - run: rustup update --no-self-update stable
      - run: cargo test --locked

  crates:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # the OIDC exchange with crates.io; there is no token secret
      contents: read
    steps:
      - uses: actions/checkout@v5
      - run: rustup update --no-self-update stable
      # OIDC -> a 30-minute token, revoked when the job ends.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: publish, unless this version is already up
        # The skip makes a re-run after a partial release idempotent —
        # cargo publish hard-fails on a version that already exists.
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if curl -sf https://index.crates.io/op/en/openroutine | grep -q "\"vers\":\"$version\""; then
            echo "openroutine $version is already on crates.io; skipping"
          else
            cargo publish --locked
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-14 }
          # Cross-compiled: the arm64 runner carries the x64 macOS SDK too.
          - { target: x86_64-apple-darwin, runner: macos-14 }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup update --no-self-update stable
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: >
          tar -czf openroutine-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz
          -C target/${{ matrix.target }}/release openroutine
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.target }}
          path: "*.tar.gz"
      # The wheel packs the binary just built into its scripts dir, so pip
      # installs the same bytes the tarball carries. maturin runs cargo with
      # the same profile and target dir and adds no rustflags, so this is a
      # cache hit — it repackages, it does not recompile. Don't turn on strip;
      # that would fork the wheel's binary from the tarball's.
      #
      # --compatibility pypi makes maturin apply PyPI's own upload rules to the
      # tag it picks, so a wheel PyPI would reject fails here instead of after
      # crates.io and the GitHub release have gone out. pipx is preinstalled on
      # every runner this matrix uses.
      - run: >
          pipx run maturin==1.14.1 build --release --locked
          --target ${{ matrix.target }} --compatibility pypi --out dist
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: tarball-*
          merge-multiple: true
      - run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.tar.gz
          --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # Unlike npm, the wheels bundle the binary, so this needs the build and not
  # the release.
  pypi:
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write # the OIDC exchange with PyPI; there is no token secret
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # The same idempotency the crates.io and npm jobs get from their
          # existence probes: a re-run after a partial release is safe.
          skip-existing: true

  npm:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      id-token: write # the OIDC exchange with npm; there is no token secret
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm is new enough for trusted publishing
        run: |
          # OIDC-based publishing needs npm >= 11.5.1; Node 24 bundles it,
          # this asserts rather than assumes.
          v="$(npm --version)"
          printf '%s\n11.5.1\n' "$v" | sort -V | head -1 | grep -qx '11.5.1' \
            || { echo "npm $v is older than 11.5.1"; exit 1; }
      - run: cp LICENSE npm/
      - name: publish, unless this version is already up
        # The skip makes a re-run after a partial release idempotent — npm
        # hard-fails on a version that already exists.
        run: |
          set -eu
          version="$(node -p "require('./npm/package.json').version")"
          if npm view "openroutine@$version" version >/dev/null 2>&1; then
            echo "openroutine@$version is already on npm; skipping"
          else
            npm publish ./npm
          fi

  # This repo doubles as its own Homebrew tap, so the formula is bumped in
  # place once the release its URLs point at exists.
  formula:
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # The workflow runs on a tag, so check out the branch we mean to commit
      # to rather than the detached HEAD the tag would give us.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # a shallow clone cannot rebase on the race path below
      # Hash what the formula's URLs actually serve, not the build artifacts we
      # believe match them. It also proves all four assets are live before the
      # tap starts advertising them.
      - name: fetch the tarballs the formula will point at
        run: >
          gh release download "$GITHUB_REF_NAME" --dir tarballs --pattern '*.tar.gz'
        env:
          GH_TOKEN: ${{ github.token }}
      - run: .github/scripts/update-formula.sh "${GITHUB_REF_NAME#v}" tarballs
      - name: commit, unless the formula is already current
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/openroutine.rb
          if git diff --cached --quiet; then
            echo "Formula/openroutine.rb is already current; skipping"
            exit 0
          fi
          git commit -m "brew: openroutine ${GITHUB_REF_NAME#v}"
          # main may have moved while the release was building.
          for _ in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
