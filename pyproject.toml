# The PyPI package is the same prebuilt binary the other channels ship, packed
# into a wheel's scripts directory so `pip install openroutine` puts it on PATH.
# There is no Python code here: maturin's `bin` bindings wrap the Rust binary.
[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "openroutine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# Both are read from Cargo.toml, so the version lives in exactly one place.
dynamic = ["version", "description"]
keywords = ["cron", "scheduler", "agents", "automation", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://openroutine.dev"
Repository = "https://github.com/soulmachine/openroutine"

[tool.maturin]
# Mandatory, not decorative: the crate has both a lib and a bin target, so
# maturin's auto-detection is ambiguous and refuses to guess.
bindings = "bin"
