# The PyPI package is the same prebuilt binary the other channels ship, packed
# into a wheel's scripts directory so `pip install openroutine` puts it on PATH.
# There is no Python code here: maturin's `bin` bindings wrap the Rust binary.
[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "openroutine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
# Both are read from Cargo.toml, so the version lives in exactly one place.
dynamic = ["version", "description"]
keywords = ["cron", "scheduler", "agents", "automation", "ai"]
# The missing "License :: OSI Approved :: MIT License" is deliberate: `license`
# above emits a PEP 639 License-Expression, and PyPI rejects an upload that
# carries both that and a license classifier.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://openroutine.dev"
Repository = "https://github.com/soulmachine/openroutine"

[tool.maturin]
# Auto-detection would pick this today, but only because the lib target is a
# plain `lib`: adding `crate-type = ["cdylib"]` or a pyo3 dependency would
# silently flip it to cffi/pyo3 and ship a wheel with no CLI in it. Pinning the
# binding model turns that into a build error instead of a surprise.
bindings = "bin"
