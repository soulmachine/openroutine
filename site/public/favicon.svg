<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="OpenRoutine">
  <style>
    :root { --mark: #7a5c3e; --cut: #fbfaf8; }
    @media (prefers-color-scheme: dark) {
      :root { --mark: #c8a179; --cut: #16151a; }
    }
  </style>
  <!-- The cron wildcard, which is the whole idea: a schedule you can read. -->
  <rect width="32" height="32" rx="7" fill="var(--mark)"/>
  <g stroke="var(--cut)" stroke-width="3.4" stroke-linecap="round">
    <line x1="16" y1="8"    x2="16"   y2="24"/>
    <line x1="22.93" y1="12" x2="9.07" y2="20"/>
    <line x1="22.93" y1="20" x2="9.07" y2="12"/>
  </g>
</svg>
