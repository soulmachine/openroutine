<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 — OpenRoutine</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<a class="skip-link" href="#main">跳到正文</a>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="/zh/">
      <img src="/favicon-192.png" alt="" width="26" height="26">
      OpenRoutine
    </a>
    <nav>
      <a href="/zh/docs">文档</a>
      <a href="https://github.com/soulmachine/openroutine">GitHub</a>
      <a href="/404" data-lang-switch="en" lang="en" hreflang="en">English</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="centered">
    <div class="wrap">
      <h1>页面不存在</h1>
      <p class="lede">
        这个地址上没有页面。没有安排任何东西，也没有跳过任何东西。
      </p>
      <div class="cta">
        <a class="btn" href="/zh/">首页</a>
        <a class="btn ghost" href="/zh/docs">文档</a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <p class="meta">
      <span>MIT 许可证</span>
      <span>© 2026 Frank Dai</span>
      <a href="https://github.com/soulmachine/openroutine">GitHub</a>
    </p>
  </div>
</footer>

<script>
(() => {
  const KEY = "or-lang";
  const swap = document.querySelector("a[data-lang-switch]");
  if (!swap) return;
  swap.addEventListener("click", () => {
    try { localStorage.setItem(KEY, swap.getAttribute("data-lang-switch")); } catch {}
  });
  if (!document.documentElement.lang.startsWith("en")) return;
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  const want = saved || navigator.language || "";
  if (want.toLowerCase().startsWith("zh")) location.replace(swap.href);
})();
</script>
</body>
</html>
